# Local preparation only. Manual build by default; no push-triggered publishing.
name: Academic website — manual build and optional release
"on":
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after the owner has approved release settings and content
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out website sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up tested Quarto version
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: '1.10.18'
      - name: Build and validate the allowlisted production artifact
        env:
          REQUEST_PUBLISH: ${{ inputs.publish }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          args = ['python3', 'scripts/build_production.py']
          if os.environ['REQUEST_PUBLISH'] == 'true':
              args.append('--release')
          subprocess.run(args, check=True)
          PY
      - name: Upload only the validated rendered site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .build/production/_site-production
  deploy:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
